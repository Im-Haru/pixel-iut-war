<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Iut War</title>
    <link rel="stylesheet" href="style.css">
    <script src="pixelWar.js"></script>
</head>

<body>
    <header class="test">
        <h1>Pixel Iut War</h1>
    </header>
    <div class="main-container">
        <div id="pixel-grid"></div>
        <div class="controls">
            <div class="panel">
                <div class="panel-header">Identification obligatoire</div>
                <input type="text" id="uid" placeholder="Entrez votre UID">
            </div>
            
            <div class="panel">
                <div class="panel-header">Choisir une couleur</div>
                <input type="color" id="color" value="#ffffff">
            </div>

            <div class="panel">
                <div class="panel-header">Temps d'attente avant modification</div>
                <div id="wait-time">Vous pouvez modifier un pixel</div>
            </div>

            <div class="panel">
                <div class="panel-header">Choisir votre équipe :</div>
                <div class="team-buttons">
                    <button onclick="choisirEquipe(1)">Equipe 1</button>
                    <button onclick="choisirEquipe(2)">Equipe 2</button>
                    <button onclick="choisirEquipe(3)">Equipe 3</button>
                    <button onclick="choisirEquipe(4)">Equipe 4</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Dernière information retournée par le serveur :</div>
                <div id="server-message"></div>
            </div>
        </div>
    </div>
</body>
</html>
